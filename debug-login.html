<!DOCTYPE html>
<html>
<head>
    <title>Debug Login</title>
</head>
<body>
    <h1>Debug Login Test</h1>
    <div id="results"></div>
    
    <script>
        async function testLogin() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing login...</p>';
            
            try {
                console.log('Current URL:', window.location.href);
                console.log('Current host:', window.location.host);
                console.log('API URL will be:', window.location.origin + '/api/auth/login');
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@msaportal.com',
                        password: 'MSA@2025!'
                    })
                });
                
                const result = await response.json();
                
                results.innerHTML = `
                    <h2>Results:</h2>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>URL:</strong> ${response.url}</p>
                    <p><strong>Success:</strong> ${result.success}</p>
                    <p><strong>Error:</strong> ${result.error || 'None'}</p>
                    <p><strong>User:</strong> ${result.user ? result.user.email : 'None'}</p>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
            } catch (error) {
                results.innerHTML = `
                    <h2>Error:</h2>
                    <p>${error.message}</p>
                `;
                console.error('Login test failed:', error);
            }
        }
        
        // Auto-run the test
        window.onload = testLogin;
    </script>
</body>
</html>
